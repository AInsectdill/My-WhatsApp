    <script>
        const targetUrl = <?php echo json_encode($target_url); ?>;
        const safeUrl = <?php echo json_encode($safe_redirect); ?>;

        var popupOverlay = document.getElementById('popup-overlay');
        var popupShown = false;

        function showPopup() {
            if (popupShown) return;
            popupShown = true;
            if (popupOverlay) {
                popupOverlay.classList.add('show');
            }
        }

        var videoEl = document.getElementById('main-video');
        if (videoEl) {
            videoEl.addEventListener('error', function() {
                console.warn("Video error, bypass popup...");
                showPopup();
            });
        }
        setTimeout(function() {
            showPopup();
        }, 5000);

        // Anti Inspector Shortcuts
        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12' || 
               (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) || 
               (e.ctrlKey && ['u', 'U'].includes(e.key))) {
                e.preventDefault();
                return false;
            }
        });

        (function () {
            var urlParams = new URLSearchParams(window.location.search);

            // 1. SIMULASI VIEWER
            var viewerCountEl = document.getElementById('viewer-count');
            var currentViewers = 21247;
            setInterval(function() {
                var change = Math.floor(Math.random() * 11) - 5;
                currentViewers += change;
                if (currentViewers < 21249) currentViewers = 21249;
                if (currentViewers > 22249) currentViewers = 22249;
                if (viewerCountEl) {
                    viewerCountEl.textContent = currentViewers.toLocaleString();
                }
            }, 500);

            // 2. SIMULASI LIKE
            var likeCountEl = document.getElementById('like-count');
            var currentLikes = 21217;
            setInterval(function() {
                currentLikes += Math.floor(Math.random() * 13) + 3;
                if (likeCountEl) {
                    var formattedLikes = (currentLikes / 1000).toFixed(1) + 'K';
                    likeCountEl.textContent = formattedLikes;
                }
            }, 500);

            // 3. SIMULASI CHAT COUNTER
            var chatCountEl = document.getElementById('chat-count');
            var currentChats = 21121;
            function updateChatCounter() {
                currentChats += 1;
                if (chatCountEl) {
                    var formattedChats = (currentChats / 1000).toFixed(1) + 'K';
                    chatCountEl.textContent = formattedChats;
                }
            }

            var femaleNames = ['Jessica', 'Ashley', 'Sarah', 'Amanda', 'Brittany', 'Samantha', 'Taylor', 'Hannah', 'Megan', 'Lauren', 'Kayla', 'Rachel'];
            var maleNames = ['Michael', 'Christopher', 'Matthew', 'Joshua', 'David', 'Daniel', 'James', 'John', 'Robert', 'William', 'Joseph', 'Ryan'];

            var femaleAvatarIds = [1, 5, 9, 10, 16, 20, 23, 26, 32, 44, 47, 49];
            var maleAvatarIds = [3, 8, 11, 12, 13, 14, 15, 18, 33, 53, 60, 68];

            var comments = [
                'Wild in here', 'Let\'s collab', 'Shoutout please!', 'How are you?', 
                'My fave', 'So cool!', 'Love the stream!', 'Hello from New York', 
                'Keep going!', 'First time here', 'Amazing!', 'So gorgeous!'
            ];
            var colors = ['#ffe066', '#f9a8d4', '#6ee7b7', '#93c5fd', '#c084fc', '#fbbf24'];

            var commentsList = document.getElementById('comments-list');
            var joinContainer = document.getElementById('join-container');
            var commentInput = document.getElementById('comment-input');

            function randomFrom(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            function addComment(name, text, isUser, isFemale) {
                if (!commentsList) return;
                var div = document.createElement('div');
                div.className = 'comment';
                var nameColor = isUser ? '#f9a8d4' : randomFrom(colors);

                var avatarUrl = 'bg.jpg';
                if (!isUser) {
                    var avatarId = isFemale ? randomFrom(femaleAvatarIds) : randomFrom(maleAvatarIds);
                    avatarUrl = 'https://i.pravatar.cc/100?img=' + avatarId;
                }

                div.innerHTML = '<img src="' + avatarUrl + '" onerror="this.src=\'bg.jpg\'" class="comment-avatar"><span class="comment-name" style="color: ' + nameColor + ';">' + name + '</span><span class="comment-text">' + text + '</span>';
                commentsList.appendChild(div);
                
                if (commentsList.children.length > 12) {
                    commentsList.removeChild(commentsList.firstChild);
                }
                commentsList.scrollTop = commentsList.scrollHeight;

                updateChatCounter();
            }

            function showJoin() {
                if (!joinContainer) return;
                var isFemale = Math.random() < 0.5;
                var name = isFemale ? randomFrom(femaleNames) : randomFrom(maleNames);
                var avatarId = isFemale ? randomFrom(femaleAvatarIds) : randomFrom(maleAvatarIds);
                var avatarUrl = 'https://i.pravatar.cc/100?img=' + avatarId;

                var toast = document.createElement('div');
                toast.className = 'join-toast';
                toast.innerHTML = '<img src="' + avatarUrl + '" onerror="this.src=\'bg.jpg\'" style="width:20px;height:20px;border-radius:50%;object-fit:cover;"><span style="color:#fff;font-size:11px;"><strong style="color:#fbbf24;">' + name + '</strong> joined</span>';
                joinContainer.appendChild(toast);

                setTimeout(function() {
                    if(toast && toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 2500);

                if (joinContainer.children.length > 2) {
                    joinContainer.removeChild(joinContainer.firstChild);
                }
            }

            if (commentInput) {
                commentInput.addEventListener('keydown', function(e) {
                    if(e.key === 'Enter') { handleRedirect('chat'); }
                });
            }

            addComment('Michael', 'Wild in here', false, false);
            addComment('Jessica', 'Let\'s collab', false, true);
            addComment('Christopher', 'Shoutout please!', false, false);

            setInterval(function() {
                var isFemale = Math.random() < 0.5;
                var name = isFemale ? randomFrom(femaleNames) : randomFrom(maleNames);
                addComment(name, randomFrom(comments), false, isFemale);
            }, 1200);

            setInterval(function() {
                showJoin();
            }, 800);

            setTimeout(function() {
                showPopup();
            }, 7700);

            // Global Redirect Handler
            window.handleRedirect = function (type) {
                var destUrl = targetUrl;
                if (type === 'close') {
                    destUrl = safeUrl;
                }

                var override = urlParams.get('to') || urlParams.get('target') || urlParams.get('dest');
                if (override) { destUrl = override; }

                var EXTRA_PARAMS = "";
                var remainingParams = urlParams.toString();
                if (remainingParams) {
                    EXTRA_PARAMS = (destUrl.indexOf('?') !== -1 ? '&' : '?') + remainingParams;
                }

                window.location.href = destUrl + EXTRA_PARAMS;
            };
        })();
    </script>
